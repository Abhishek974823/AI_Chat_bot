<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova</title>

<!-- Bootstrap 5.3 CSS (this gives us all the card, input-group, navbar classes) -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
  /* ---------- ONLY custom CSS in this file: the animated gradient background ---------- */
  body {
    /* 4 colors, will animate by sliding the gradient position */
    background: linear-gradient(-45deg, #4e2a84, #8134af, #3a6ea5, #16222a);
    background-size: 400% 400%;
    animation: gradientShift 15s ease infinite;
    min-height: 100vh;
  }

  @keyframes gradientShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* small tweak so the chat area scrolls instead of growing the whole page */
  #chat-body {
    height: 60vh;
    overflow-y: auto;
  }
</style>
</head>
<body>

  <!-- ===================== NAVBAR (Bootstrap component) ===================== -->
  <nav class="navbar navbar-dark px-4 py-3 bg-transparent">
    <span class="navbar-brand mb-0">
      <strong class="fs-4">Nova</strong>
      <small class="text-white-50 ms-2">AI Assistant</small>
    </span>
  </nav>

  <!-- ===================== MAIN CONTAINER ===================== -->
  <div class="container" style="max-width: 700px;">

    <!-- Bootstrap card = the whole chat box -->
    <div class="card shadow-lg border-0 rounded-4 overflow-hidden">

      <!-- chat messages go inside here -->
      <div class="card-body bg-white" id="chat-body">
        <!-- BOT message: aligned left, grey bubble -->
        <div class="d-flex justify-content-start mb-3">
          <div class="bg-light rounded-3 px-3 py-2" style="max-width: 75%;">
            Hi, I'm Nova. Ask me anything.
          </div>
        </div>
       {% for i in range(prompts|length): %}
       <div class="d-flex justify-content-end mb-3">
        <div class="bg-primary text-white rounded-3 px-3 py-2">{{ prompts[i] }}</div>
      </div>
      <div class="d-flex justify-content-start mb-3">
        <div class="bg-light rounded-3 px-3 py-2">{{ answers[i] }}</div>
      </div>
      {% endfor %}
        <!-- more messages get added here by JavaScript when you type -->
        

      </div>

      <!-- input bar = Bootstrap input-group, sits inside card-footer -->
      <div class="card-footer bg-white border-0 p-3">
            <form action="/" method="post" class="input-group">
                <input type="text" id="user-input" name="prompt" class="form-control" placeholder="Message Nova..." required>
                <button class="btn btn-primary" id="send-btn" type="submit">Send</button>
            </form>
      </div>

    </div>
  </div>

  <!-- Bootstrap JS bundle (not strictly needed here since we use no dropdowns/modals, but harmless to include) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  

</body>
</html>
